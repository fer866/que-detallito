<div class="gallery">
    <div #gallery_scroller class="gallery-scroller" (scroll)="onScroll($event)">
        <ng-content></ng-content>
    </div>
    <span *ngIf="showArrows" class="btn prev hide-on-med-and-down" title="Anterior" aria-label="anterior" (click)="scrollToPrevPage()">
        <mat-icon>chevron_left</mat-icon>
    </span>
    <span *ngIf="showArrows" class="btn next hide-on-med-and-down" title="Siguiente" aria-label="siguiente" (click)="scrollToNextPage()">
        <mat-icon>chevron_right</mat-icon>
    </span>
    <div class="btn-dots">
        <span *ngFor="let dot of galleryCount" (click)="changePage(dot)" [ngClass]="dot === currentPage ? 'dot active-dot' : 'dot'"></span>
    </div>
</div>
