<mat-sidenav-container>
    <mat-sidenav #sidenav mode="over" [autoFocus]="false" fixedInViewport fixedTopGap="56">
      <div class="sidenav-header">
        <h3>Que Detallito</h3>
      </div>
      <div class="sidenav-content">
        <ul>
            <li *ngFor="let opt of menuOptions" routerLinkActive="active">
                <a mat-button [routerLink]="opt.url" (click)="onSidenavItemClicked(opt)">
                  <mat-icon>{{opt.icon}}</mat-icon>&nbsp;{{opt.name}}
                </a>
            </li>
        </ul>
      </div>
    </mat-sidenav>
  
    <mat-sidenav #optionsNav mode="over" position="end" [autoFocus]="false" fixedInViewport fixedTopGap="56">
      <div class="options-sidenav">
        <ng-container *ngIf="(tablet | async) && (showFilters | async)">
          <app-filter-product></app-filter-product>
        </ng-container>
      </div>
    </mat-sidenav>
  
    <mat-sidenav-content>
      <div class="app-sidenav-content">
        <ng-content></ng-content>
      </div>
    </mat-sidenav-content>
</mat-sidenav-container>
